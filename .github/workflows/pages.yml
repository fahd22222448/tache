name: Publier l'app et synchroniser l'EDT

on:
  push:
    branches: [main]
  # Vérification automatique de l'emploi du temps (et des trajets) toutes les 20 minutes,
  # de 5h à 23h heure de Paris (heures en UTC ci-dessous ; GitHub peut décaler de quelques minutes).
  schedule:
    - cron: '*/20 3-21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest icon.svg sw.js js _site/

      - name: Récupérer l'emploi du temps
        env:
          EDT_GROUP: ${{ vars.EDT_GROUP || 'RT3-FA-A1' }}
          EDT_BASE: ${{ vars.EDT_BASE || 'https://edt.iut-velizy.uvsq.fr' }}
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/edt.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
          HOME_ADDRESS: ${{ vars.HOME_ADDRESS }}
          IUT_ADDRESS: ${{ vars.IUT_ADDRESS }}
          ARRIVE_MARGIN: ${{ vars.ARRIVE_MARGIN }}
        run: node scripts/fetch-edt.mjs --out _site/edt.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub met en pause les workflows planifiés après 60 jours sans activité sur le dépôt.
  # Une fois par semaine (lundi), on réactive celui-ci pour que la synchro ne s'arrête jamais.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Garder la synchro active
        if: ${{ github.event.schedule == '*/20 3-21 * * *' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u%H%M)" \< "10320" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" && echo "Workflow réactivé"
          else
            echo "Rien à faire"
          fi
